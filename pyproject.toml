[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccef-net"
version = "0.1.0"
description = "Cultural Context-Aware Evidence Fusion Network research"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ccef_net*"]
